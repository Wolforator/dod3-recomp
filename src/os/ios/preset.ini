# ios preset 2 -- the phone's defaults (src/os/ios/preset.ini). The app sets
# these in its dod3.ini once (a new install's has them already); after that
# the Settings menu's changes stay.
# Frame rate: 60, capped. Settings > Graphics Settings > Frame Rate
# "30 (Original)" is the battery-saving 30.
DOD3_FPS = 60
# The screen's own shape (about 19.5:9): more of the scene at the sides, the
# HUD, menus and movies 16:9 in the middle.
DOD3_ASPECT = auto
# Resolution 1.25: the wide view is 1280 game pixels across at 1, so 589
# lines; 1.25 keeps it about as sharp as 720p (1600x736).
RSX_SCALE = 1.25
